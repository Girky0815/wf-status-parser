name: Warframeステータス更新

on:
  schedule:
    - cron: '0/5 * * * *'  # 5分ごとに実行 (0, 5, 10...)
  workflow_dispatch:
  push:
    paths:
      - 'src/**.py'

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    
    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4
      
    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: latest
        
    - name: 依存関係のインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: ステータスパーサーの実行
      run: python src/main.py
      
    - name: 変更のコミットとプッシュ
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add output/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Warframeステータス更新 [skip ci]" && git push)
